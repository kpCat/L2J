# ---------------------------------------------------------------------------
# Phantom World
# ---------------------------------------------------------------------------
# Production materialization remains explicit and disabled by default.

# Enable the Phantom World lifecycle. No profile is materialized automatically.
EnablePhantomSystem = False

# Enable bounded sampled in-memory diagnostics.
EnablePhantomDiagnostics = False

# Hard safety cap for concurrently retained/materialized Phantom actors.
# This is not a population target. Valid enabled range: 1..10000.
MaxMaterializedPhantoms = 32

# Hard cap for explicitly registered runtime scheduler profiles.
# This is a capacity guard, not a population target. Valid range: 1..1000000.
MaxScheduledPhantomProfiles = 10000

# Interval of the single shared scheduler pulse. Valid range: 10..1000 ms.
PhantomSchedulerPulseMillis = 100

# Maximum profile processing opportunities per shared pulse. Valid range: 1..10000.
PhantomSchedulerProfilesPerPulse = 128

# Desired durable managed population. Zero keeps population creation inert.
# Valid range: 0..MaxScheduledPhantomProfiles.
PhantomPopulationTarget = 0

# Maximum managed population admitted to ACTIVE at once.
# Valid range: 0..min(PhantomPopulationTarget, MaxMaterializedPhantoms).
PhantomPopulationActiveTarget = 0

# Maximum concurrent restart-safe character creation operations. Valid range: 1..64.
PhantomPopulationCreationInFlight = 2

# Maximum due schedule/retirement boundaries handled by one shared pulse.
# Valid range: 1..10000.
PhantomPopulationBoundariesPerPulse = 64

# Maximum party coordinator actions consumed by one shared scheduler pulse.
# Valid range: 10..10000. Missing legacy key defaults to 64.
PhantomPartyOperationsPerPulse = 64

# IANA time zone used to interpret weekly local-time schedules.
PhantomPopulationTimeZone = UTC

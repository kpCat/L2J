# ---------------------------------------------------------------------------
# Phantom World: lifecycle, разговор, бюджеты и население фантомов.
# ---------------------------------------------------------------------------
# Shipped default: система False, durable target 0, ACTIVE target 0;
# даже при включённом master switch население само не создаётся без target.
# Файл читается при старте Game Server; после изменения нужен перезапуск.
# Ошибки значений отключают систему целиком. Проценты нагрузки не измерялись.
# Изменение chances заточки принадлежит data/EnchantItemGroups.xml, safe range
# вытекает из его current ranges, максимум — из таблицы и Player.ini protection.
# Normal scroll уничтожает вещь при провале, blessed сбрасывает уровень в 0,
# safe/ancient-crystal сохраняет уровень; scroll/support bonus ограничен 100%.
# Сейчас private-store plan хранит явную цену; новой market valuation нет.
# Будущая valuation обязана читать owners после reload enchant data/restart;
# второй таблицы chances в Phantom config вводить нельзя.
# Канонический local-play guide: ../../../docs/phantoms/PHANTOM_QUICKSTART_RU.md
# Копируемый preset: ../../../docs/phantoms/examples/PhantomPlayers.local-play.ini

# True/False, default False: главный lifecycle gate. True разрешает дальнейшие
# subsystems, но население требует PhantomPopulationTarget > 0.
# CPU/RAM/БД/диск/сеть/scheduler при False нет; при True масштаб зависит от
# durable и ACTIVE targets ниже, а не от самого switch. Игровой эффект —
# допуск живых персонажей Phantom. Малому серверу сначала оставить False,
# затем включать с малыми targets; нужен restart Game Server.
EnablePhantomSystem = False

# True/False, default True: добавляет humanized social layer Goal038; игровые
# intents остаются авторитетны. CPU низкая на разговор, RAM низкая для каталога,
# БД/диск штатная память/профиль, сеть — только произнесённые сообщения;
# scheduler/latency зависит от частоты диалога, не создаёт поток на бота.
# Масштаб — число разговоров ACTIVE фантомов. Малому серверу оставить True;
# действует лишь при EnablePhantomSystem и требует restart Game Server.
EnablePhantomHumanizedConversation = True

# True/False, default True: добавляет валидированный custom semantic pack.
# Игровой эффект — вариации речи, без подмены игровых команд. CPU низкая на
# выбор фразы, RAM низкая на каталог, диск — один read при загрузке,
# БД нет нового потока, сеть — только реплики, scheduler новых задач нет;
# масштаб — размер каталога и частота реплик. Малому серверу оставить True;
# нужен master switch и корректный pack, после изменения restart.
EnablePhantomCustomConversationPack = True

# NEUTRAL/CASUAL, default CASUAL: регистр социальной речи, не AI-решений.
# CPU/RAM/БД/диск/scheduler дополнительной нагрузки нет; сеть зависит лишь
# от числа реплик, не от token. Масштаб — разговоры ACTIVE фантомов;
# latency нового цикла нет. Малому серверу CASUAL; нужен humanized layer,
# ошибка enum fail-closed, после изменения restart Game Server.
PhantomConversationRegister = CASUAL

# NONE/MILD/CONTEXTUAL, default CONTEXTUAL: допустимая резкость речи.
# Игровой эффект только текст. CPU низкая на выбор, RAM/БД/диск/scheduler
# дополнительной нагрузки нет, сеть — штатная реплика; масштаб — разговоры,
# latency нового цикла нет. Малому серверу CONTEXTUAL; зрелый контент всё равно
# требует отдельный explicit opt-in; нужен humanized layer и restart.
PhantomConversationProfanity = CONTEXTUAL

# LOW/MEDIUM/HIGH, default HIGH: разнообразие текста из существующего pack.
# CPU низкая на выбор, RAM низкая для загруженного pack, БД/диск без нового
# I/O в разговоре, сеть только реплики, scheduler нового цикла нет;
# масштаб — частота реплик, а не размер durable population. Малому серверу
# HIGH; требуется humanized layer/валидированный pack, нужен restart.
PhantomConversationVariation = HIGH

# True/False, default False: отдельный opt-in зрелой речи; без humanized
# layer не действует. CPU низкая на текстовый выбор, RAM/БД/диск/scheduler
# новых расходов нет, сеть — только выбранные реплики; масштаб — число
# разговоров, latency нового цикла нет. Малому серверу оставить False,
# включать лишь осознанно; после изменения restart Game Server.
EnablePhantomMatureConversation = False

# True/False, default False: bounded selected diagnostics, а не log каждого
# AI тика. CPU низкая/средняя при выбранном trace, RAM растёт с ограниченным
# буфером, БД/диск только редкая публикация, сеть нет; scheduler добавляет
# sampling/publication work. Масштаб — выбранные профили/частота samples.
# Малому серверу False, включать для диагностики; нужен master/restart.
EnablePhantomDiagnostics = False

# Integer 1..10000, default 32: жёсткий cap удерживаемых materialized Player,
# не цель населения. ACTIVE/materialized — дорогая часть: CPU тики/боёв,
# RAM Player/world/known-list, БД штатные состояния, сеть видимые обновления;
# scheduler pressure растёт с числом ACTIVE, latency зависит от бюджета.
# Малому серверу 8..32 после профилирования; cap <= MaxScheduledProfiles,
# ACTIVE target <= cap. Изменение требует restart Game Server.
MaxMaterializedPhantoms = 32

# Integer 1..1000000, default 10000: ёмкость зарегистрированных durable/
# scheduled profiles, не число одновременно видимых ботов. CPU/RAM scheduler
# state и БД/диск durable footprint растут с профилями; сеть почти нет,
# materialized world costs определяются ACTIVE/cap, scheduler backlog
# зависит от pulse budget. Малому серверу достаточно ёмкости >= target и
# MaxMaterializedPhantoms; высокий технический cap не benchmark. Restart.
MaxScheduledPhantomProfiles = 10000

# Integer 10..1000 ms, default 100: период единого scheduler wakeup.
# 1000 ms = 1 pulse/sec; 100 = 10/sec; 50 = 20/sec; 10 = 100/sec.
# Меньше интервал — больше wakeups/pressure и меньше latency очереди,
# но CPU не обязан линейно удваиваться: work ограничен per-pulse budgets.
# RAM/БД/диск/сеть сами по себе не растут, косвенно растёт частота work;
# масштаб — число due profiles и budget. Малому серверу 100 ms как shipped,
# 10 ms только после замера; нужен master и restart Game Server.
PhantomSchedulerPulseMillis = 100

# Integer 1..10000, default 128: максимум profile opportunities за pulse.
# Больший budget снижает backlog/latency, но усиливает CPU burst и возможное
# штатное БД/диск/сеть work; RAM низкая на очередь, масштаб — due profiles.
# Малому серверу 128; поднимать только при подтверждённом backlog, держать
# <= MaxScheduledPhantomProfiles; нужен master и restart Game Server.
PhantomSchedulerProfilesPerPulse = 128

# Integer 0..MaxScheduledPhantomProfiles, default 0: желаемое число durable
# managed identities. 0 запрещает auto creation даже при master=True.
# CPU/RAM scheduler state и БД/диск profiles растут с target; сеть почти нет,
# world/known-list расходы задаются ACTIVE/cap, scheduler backlog — числом
# due profiles. Малому серверу начать с 10..50, а ACTIVE с 2..8;
# target не равен online числу. Нужен master и restart Game Server.
PhantomPopulationTarget = 0

# Integer 0..min(PhantomPopulationTarget,MaxMaterializedPhantoms), default 0:
# целевое число ACTIVE, не общий durable target и не hard cap. Здесь CPU/RAM
# Player/world/known-list/AI/боёв, сеть видимые packets и штатный DB state
# растут с активными персонажами; scheduler/latency зависит от их work.
# Малому серверу 2..8 при durable 10..50; 0 оставляет профили без ACTIVE.
# Нужны master, ненулевой population и materialized cap; restart Game Server.
PhantomPopulationActiveTarget = 0

# Integer 1..64, default 2: число concurrent restart-safe creation sagas.
# CPU и RAM burst при создании, БД/диск высокий кратковременный I/O,
# сеть почти нет, scheduler backlog уменьшается при большем лимите, но
# latency остальных операций может расти. Масштаб — pending creations, не
# каждый профиль постоянно. Малому серверу 1..2; требует population > 0
# для эффекта, нужен master и restart Game Server.
PhantomPopulationCreationInFlight = 2

# Integer 1..10000, default 64: due schedule/retirement boundaries за pulse.
# Больше — меньше backlog/latency при bootstrap и turnover, но выше CPU burst
# и возможный БД/диск I/O; RAM низкая на bounded batch, сеть косвенно при
# переходе ACTIVE, scheduler work ограничен бюджетом. Масштаб — due boundaries.
# Малому серверу 64; поднимать после измерения backlog, нужен master/restart.
PhantomPopulationBoundariesPerPulse = 64

# Integer 10..10000, default 64: party operations за pulse.
# Больше снижает backlog/latency групп, но усиливает CPU burst и contention;
# RAM низкая для bounded очереди, БД/диск/сеть только native последствия
# party действий. Масштаб — число активных групп/запросов. Малому серверу
# 64; менять при наблюдаемой очереди, нужен master и restart Game Server.
PhantomPartyOperationsPerPulse = 64

# Integer 16..10000, default 1024: access-order social profile cache cap.
# Больше RAM, меньше DB/disk churn при повторных lookup; CPU низкая на cache
# lookup, сеть нет, scheduler/latency меньше при cache hit. Масштаб — число
# разных профилей с social access, не все durable. Малому серверу 256..1024;
# уменьшать при RAM pressure, увеличивать при доказанном churn; restart.
PhantomSocialCacheProfiles = 1024

# Valid IANA ZoneId длиной 1..64 символа, default UTC: интерпретация
# локальных недельных расписаний. Не меняет уже случившиеся события.
# CPU низкая на boundary conversion, RAM/БД/диск/сеть дополнительных
# расходов нет; scheduler due time меняется, latency следует расписанию.
# Масштаб — число schedule boundaries. Малому серверу UTC либо свой точный
# IANA zone; недопустимая zone fail-closed, нужен master и restart.
PhantomPopulationTimeZone = UTC

# True/False, default False: durable ecology assignment, causal catch-up,
# turnover. CPU/БД/диск средние при первом assignment/backlog, RAM bounded
# state, сеть почти нет, scheduler boundaries получают дополнительную работу;
# масштаб — managed profiles и виртуальный age, не постоянные ACTIVE ticks.
# Игровой эффект — биография/замены профилей. Малому серверу сначала False,
# включать после проверки population caps; нужен master и restart.
EnablePhantomEcology = False

# FRESH/LIVING/MATURE, default LIVING: preset виртуального возраста,
# pace/personality только НОВЫХ immutable assignments; старые не меняются.
# CPU/RAM/БД/диск/сеть от выбора token сами по себе не растут; scheduler
# catch-up косвенно зависит от полученного age. Масштаб — новые назначения.
# Малому серверу LIVING; веса принадлежат versioned ecology XML, не ini;
# нужен EnablePhantomEcology/master и restart Game Server.
PhantomEcologyPreset = LIVING

# Integer -1 либо 0..3650, default -1: virtual world age для НОВЫХ
# assignments; -1 берёт bounded default preset. Больше age — длиннее
# causal catch-up и scheduler backlog, выше суммарные CPU/БД/диск work;
# RAM bounded, сеть почти нет. Масштаб — age x новые managed profiles,
# не изменение уже созданных identities. Малому серверу -1, повышать лишь
# после измерения catch-up; нужны ecology/master и restart Game Server.
PhantomEcologyWorldAgeDays = -1

# Integer 1..1000000, default 1000: cap durable ARCHIVED identities.
# При cap turnover останавливается, историю не удаляет. Больший cap повышает
# долгосрочные DB/disk и RAM индекс/state footprint, CPU низкая при проверке,
# сеть нет, scheduler work только при turnover; масштаб — archived count.
# Малому серверу 1000, снижать для ограничения роста архива; нужны
# ecology/master, после изменения restart Game Server.
PhantomEcologyArchiveLimit = 1000

# ---------------------------------------------------------------------------
# Phantom World
# ---------------------------------------------------------------------------
# Материализация production-персонажей требует явного включения и по умолчанию отключена.
# Канонический local-play guide: ../../../docs/phantoms/PHANTOM_QUICKSTART_RU.md
# Копируемый preset: ../../../docs/phantoms/examples/PhantomPlayers.local-play.ini

# Включает lifecycle Phantom World. Значение False запрещает автоматическую материализацию профилей и является главным fail-closed барьером.
EnablePhantomSystem = False

# Включает ограниченную выборочную диагностику в памяти. По умолчанию False, чтобы не создавать лишнюю runtime-нагрузку.
EnablePhantomDiagnostics = False

# Жёсткий верхний предел одновременно удерживаемых или материализованных фантомов; это не целевой размер населения. Безопасный диапазон при включённой системе: 1..10000, значение по умолчанию 32.
MaxMaterializedPhantoms = 32

# Жёсткая ёмкость явно зарегистрированных scheduler-профилей; это ограничитель, а не цель населения. Диапазон 1..1000000, значение по умолчанию 10000.
MaxScheduledPhantomProfiles = 10000

# Интервал единственного общего scheduler pulse в миллисекундах. Диапазон 10..1000, значение по умолчанию 100.
PhantomSchedulerPulseMillis = 100

# Максимальный бюджет возможностей обработки профилей за один общий pulse. Диапазон 1..10000, значение по умолчанию 128.
PhantomSchedulerProfilesPerPulse = 128

# Желаемое количество durable managed-профилей. Ноль полностью блокирует создание населения; диапазон 0..MaxScheduledPhantomProfiles, значение по умолчанию 0.
PhantomPopulationTarget = 0

# Максимальная цель населения в состоянии ACTIVE. Диапазон 0..min(PhantomPopulationTarget, MaxMaterializedPhantoms), значение по умолчанию 0.
PhantomPopulationActiveTarget = 0

# Максимальное число одновременных restart-safe операций создания персонажей. Диапазон 1..64, значение по умолчанию 2.
PhantomPopulationCreationInFlight = 2

# Максимальный бюджет due schedule/retirement boundaries за один общий pulse. Диапазон 1..10000, значение по умолчанию 64.
PhantomPopulationBoundariesPerPulse = 64

# Максимальный бюджет действий party coordinator за один общий scheduler pulse. Диапазон 10..10000; при отсутствии legacy-ключа используется 64.
PhantomPartyOperationsPerPulse = 64

# Максимальная ёмкость access-order cache для restart-safe social-state профилей. Диапазон 16..10000; при отсутствии legacy-ключа используется 1024.
PhantomSocialCacheProfiles = 1024

# Часовой пояс IANA для интерпретации локальных недельных расписаний. Значение по умолчанию UTC.
PhantomPopulationTimeZone = UTC
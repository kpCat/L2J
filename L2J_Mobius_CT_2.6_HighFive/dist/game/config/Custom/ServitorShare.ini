# Skill 1557 only. Each multiplier scales the positive stock bonus, not the full stat.
# False or multiplier 1.0 preserves native coefficients; XML values remain canonical.
# Finite multipliers from 0 to 100; invalid configuration falls back to stock.
EnableServitorShareBonusTuning = True
ServitorSharePAtkBonusMultiplier = 2.0
ServitorSharePDefBonusMultiplier = 2.0
ServitorShareMAtkBonusMultiplier = 2.0
ServitorShareMDefBonusMultiplier = 2.0
ServitorShareMaxHpBonusMultiplier = 2.0
ServitorShareMaxMpBonusMultiplier = 2.0
ServitorShareMaxRecoverableHpBonusMultiplier = 2.0
ServitorShareMaxRecoverableMpBonusMultiplier = 2.0
ServitorShareCritRateBonusMultiplier = 2.0
ServitorSharePAtkSpdBonusMultiplier = 2.0
ServitorShareMAtkSpdBonusMultiplier = 2.0

# Skill 1547 only. Scale the positive stock bonus of each stat independently.
# False or 1.0 preserves stock, 0.0 removes the bonus, and 2.0 doubles it.
# Use finite multipliers from 0 to 100. Invalid tuning falls back to stock.
EnableSpiritSharingBonusTuning = True
SpiritSharingPAtkBonusMultiplier = 2.0
SpiritSharingMAtkBonusMultiplier = 2.0
SpiritSharingPhysicalSkillPowerBonusMultiplier = 2.0
SpiritSharingPAtkSpdBonusMultiplier = 2.0
SpiritSharingMAtkSpdBonusMultiplier = 2.0
SpiritSharingCritRateBonusMultiplier = 2.0

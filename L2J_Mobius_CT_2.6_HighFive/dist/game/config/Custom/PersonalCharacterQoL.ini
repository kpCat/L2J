# Личные функции обычного персонажа. Изменения требуют restart GameServer.
# Для любой льготы нужны master=True, точный allowlist и соответствующий switch.
# Новые исключения067 запрещены Phantom/Background/headless; GM не даёт допуск.
# Ошибка master/allowlist отключает всё; ошибка нового ребёнка — только его функцию.
EnablePersonalCharacterQoL=True
# CLASS skills других профессий того же/низшего уровня у trainer, только main class.
# Native prerequisite/level/SP/items и alternative цены сохраняются.
EnablePersonalCrossClassSkills=True
# Native кристаллизация при реально изученном Crystallize, включая non-dwarf.
EnablePersonalCrystallization=True
# Адресный Seven Signs маршрут, глобальный цикл не меняется.
EnablePersonalSevenSignsAccess=True
# Адресные native действия поддержки группы QOL-006.
EnablePersonalPartySupport=True
# Положительные buff/dance/song после stock формулы; passive/toggle/debuff и
# explicit abnormalTime исключены. Все duration keys обязательны для блока.
EnablePersonalEffectDurations=True
# Decimal с точкой0.01..100.0;1.0 сохраняет штатное время.
PersonalBuffDurationMultiplier=5.0
PersonalDanceDurationMultiplier=15.0
PersonalSongDurationMultiplier=15.0
# До256 пар positiveSkillId,multiplier через ';', максимум4096 символов.
# Например1234,1.5;5678,0.5. Точная пара приоритетнее общего множителя.
PersonalEffectDurationOverrides=
# Положительные object IDs через ',' или ';', до256 записей/4096 символов.
# Доступ по ID ИЛИ аккаунту; оба списка пусты — доступ никому не даётся.
AllowedCharacterIds=
# Аккаунты [a-z0-9_-], до45 символов; разделители/лимиты как у IDs.
# Сравнение без учёта регистра. Указывайте только собственные точные аккаунты.
AllowedAccounts=

# Соло-вход в Kamaloka/Labyrinth без пользовательской Party. При Party сохраняется
# один instance для всех подходящих участников и лидерство. Level/reuse/range/
# instance/выход штатные; глобальный RiftMinPartySize не меняется.
EnablePersonalSoloInstanceEntry=True

# Только личный solo Rift: настоящая временная Party, native fragments и комнаты.
# Нужны master, exact allowlist, access0; Phantom/Background/headless исключены.
# Глобальный RiftMinPartySize и обычная Party не меняются; смерть завершает solo.
EnablePersonalSoloRift=True

# Только Wondrous Cubic10632: адресный reuse вместо штатных24часов.
# Старые timestamps считаются от последнего use; OFF возвращает24часа.
# Native предмет/skill/reward сохранены, остальные предметы не затронуты.
EnablePersonalWondrousCubicCooldown=True
# Целые минуты1..1440, default60. Нужны master, allowlist и switch выше.
PersonalWondrousCubicCooldownMinutes=10

# После ручного заброса: native Reel/Pump в текущем рыбном бою.
# Своя удочка/приманка, реальные skills/MP/reuse/resist/FishShots; без автозаброса.
# Потеря контекста прекращает помощь; нужны master и allowlist.
EnablePersonalFishingAssist=True

# OFF — stock; IGNORE_NEGATIVE — отрицательное в0; FLIP_NEGATIVE — в положительное.
# Stock итоговый cap+5 сохраняется. Клиентский tooltip может остаться штатным.
PersonalHennaNegativeMode=FLIP_NEGATIVE

# Только положительные численные stat-add бонусы native augmentation.
# Отрицательные/множители/skills/proc/chance/glow не усиливаются.
EnablePersonalPositiveAugmentationMultiplier=True
# Decimal с точкой1.0..5.0, default1.0; нужны master/allowlist/switch выше.
PersonalPositiveAugmentationMultiplier=5.0

# Soul Crystal: в native Q00350 нет player-overlevel запрета, пустой switch не нужен.
# Stage/NPC/quest/absorb/skill/chance штатные; SoulCrystalChanceMultiplier независим.

# ---------------------------------------------------------------------------
# Personal Character QoL
# ---------------------------------------------------------------------------
# All features are shipped disabled. A restart is required after changes.
# AllowedCharacterIds accepts positive decimal character object IDs.
# AllowedAccounts accepts account names and compares them case-insensitively.
# Lists accept comma or semicolon separators and are intentionally empty by default.
# Effect duration overrides use semicolon-separated positiveSkillId,multiplier pairs.
# Duration multipliers use a decimal point and must be between 0.01 and 100.0.


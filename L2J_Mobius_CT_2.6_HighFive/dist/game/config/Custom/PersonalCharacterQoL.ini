# ---------------------------------------------------------------------------
# Личные функции персонажа: обучение, кристаллизация, Seven Signs,
# поддержка группы и длительность положительных эффектов.
# ---------------------------------------------------------------------------
# Все switches shipped False, множители 1.0, списки пустые: никто не получает
# льготу по умолчанию. Настройки читаются при старте; нужен restart Game Server.
# Действуют только на разрешённого реального Player; headless Phantom исключён.
# Ошибка master/allowlist отключает личные функции; ошибка блока длительностей
# отключает только этот блок. Доли нагрузки ниже качественные, не benchmark.

# True/False, default False: общий выключатель личных функций. True сам по
# себе ничего не выдаёт без дочернего switch и allowlist. CPU низкая на
# проверку допуска; RAM низкая для allowlist; БД/диск и сеть без действий нет,
# scheduler/latency новых задач нет. Масштаб — обращения разрешённых игроков.
# Для малого сервера сначала заполнить точный allowlist, затем включать;
# зависимости — корректные AllowedCharacterIds/AllowedAccounts, restart.
EnablePersonalCharacterQoL=False

# True/False, default False: разрешает у реального trainer изучать обычные
# CLASS skills других профессий того же/низшего иерархического уровня.
# Только allowlisted main class; active subclass, Phantom и NPC исключены;
# штатные level/prerequisite/item/SP проверки сохранены, alternative SP 1/2/3x.
# CPU низкая на открытие дерева/покупку, RAM низкая для списка, БД/диск —
# штатное сохранение skill, сеть — штатный список/ответ; scheduler задач нет.
# Масштаб — число открытий trainer/покупок; latency растёт с размером списка.
# Для малого сервера оставить False, если нужен stock class progression;
# нужны master=True и allowlist, изменение требует restart Game Server.
EnablePersonalCrossClassSkills=False

# True/False, default False: разрешает allowlisted персонажу native
# кристаллизацию при реально выученном CRYSTALLIZE, включая non-dwarf.
# Игровой результат и расход item принадлежат stock CrystallizationService.
# CPU низкая при preview/подтверждении, RAM низкая на одноразовый token,
# БД/диск — штатная inventory mutation, сеть — панель/ответ; scheduler
# постоянной задачи нет, token живёт не более 120 секунд. Масштаб — число
# подтверждений. Для малого сервера включать только при желании дать эту
# возможность; нужны master=True, allowlist и skill, после правки restart.
EnablePersonalCrystallization=False

# True/False, default False: личный доступ к поддерживаемому Seven Signs
# маршруту для allowlisted real Player; глобальный цикл Seven Signs не меняется.
# CPU низкая на действие, RAM нет, БД/диск и сеть — штатный доступ/ответ;
# scheduler/latency нового фонового цикла нет. Масштаб — обращения участников.
# Для малого сервера включать лишь при необходимости; нужны master и
# allowlist, ограничения native доступа сохраняются, после правки restart.
EnablePersonalSevenSignsAccess=False

# True/False, default False: разрешает личные bounded действия поддержки
# группы из QOL-006 для allowlisted Player; группы других игроков не меняет.
# CPU низкая на действие, RAM низкая на временную проверку участников,
# БД/диск — только native последствия действия, сеть — штатные сообщения
# участникам; scheduler нового обхода нет. Масштаб — частота запросов и
# размер группы, latency зависит от штатной операции. Для малого сервера
# оставлять False, если stock party достаточно; master/allowlist, restart.
EnablePersonalPartySupport=False

# True/False, default False: корректирует только положительные buff/dance/song
# allowlisted real Player после stock Formulas.calcEffectAbnormalTime.
# Passive/toggle/triggered/instant/debuff и explicit abnormalTime исключены;
# headless Phantom не меняется. CPU низкая на получение эффекта, RAM низкая
# для bounded override/classifier snapshot, БД/диск — штатное сохранение
# эффектов, сеть — native обновления; scheduler задач нет. Масштаб — частота
# применений эффекта. Для малого сервера включать лишь с проверенными
# множителями; нужны master/allowlist и все четыре duration keys, restart.
EnablePersonalEffectDurations=False

# Decimal с точкой 0.01..100.0, default 1.0: множитель длительности buff.
# 1.0 сохраняет stock время; >1 продлевает, <1 сокращает только разрешённые
# положительные эффекты. CPU низкая на применение, RAM нет, БД/диск и сеть —
# лишь штатная обработка изменённой длительности, scheduler задач нет;
# масштаб — число таких применений. Для малого сервера оставить 1.0 до
# осознанного баланса; нужны EnablePersonalEffectDurations/master/allowlist,
# explicit per-skill override имеет приоритет; после правки restart.
PersonalBuffDurationMultiplier=1.0

# Decimal с точкой 0.01..100.0, default 1.0: длительность положительных dance.
# CPU низкая на применение, RAM нет, БД/диск/сеть — штатная обработка,
# scheduler задач нет; масштаб — число dance применений. >1 продлевает,
# <1 сокращает, 1.0 сохраняет stock. Для малого сервера оставить 1.0;
# нужны duration switch/master/allowlist, классификация по H5 SkillTreeData,
# конфликтное происхождение исключено; override приоритетнее; restart.
PersonalDanceDurationMultiplier=1.0

# Decimal с точкой 0.01..100.0, default 1.0: длительность положительных song.
# CPU низкая на применение, RAM нет, БД/диск/сеть — штатная обработка,
# scheduler задач нет; масштаб — число song применений. >1 продлевает,
# <1 сокращает, 1.0 сохраняет stock. Для малого сервера оставить 1.0;
# нужны duration switch/master/allowlist, H5 SkillTreeData classifier,
# конфликтное происхождение исключено; override приоритетнее; restart.
PersonalSongDurationMultiplier=1.0

# Пусто по умолчанию либо до 256 уникальных пар positiveSkillId,multiplier,
# разделённых ';': например 1234,1.5;5678,0.5. Общая строка <=4096 символов,
# множитель 0.01..100.0 с точкой. Перекрывает общий множитель только для
# разрешённого эффекта. CPU низкая lookup при применении, RAM растёт с числом
# пар, БД/диск/сеть — только stock effect path, scheduler задач нет;
# масштаб — число применений и размер bounded map. Для малого сервера
# оставить пустым, менять точечно; нужны duration switch/master/allowlist;
# неверная пара fail-closed выключает блок длительностей; нужен restart.
PersonalEffectDurationOverrides=

# Пусто по умолчанию либо положительные decimal character object IDs через
# ',' или ';', строка <=4096 символов и <=256 записей. Разрешает ровно
# перечисленных real Player; Phantom исключён. CPU низкая membership check,
# RAM растёт с числом ID, БД/диск и сеть от списка нет, scheduler задач нет;
# масштаб — число разрешённых записей и запросов. Для малого сервера указать
# 1–2 проверенных ID либо оставить пусто; нужна master функция, restart.
AllowedCharacterIds=

# Пусто по умолчанию либо имена аккаунтов [a-z0-9_-] длиной <=45 каждое,
# через ',' или ';', всего <=4096 символов и <=256 записей; сравнение без
# учёта регистра. Разрешает real Player этих аккаунтов наряду с ID-списком.
# CPU низкая membership check, RAM растёт с числом аккаунтов, БД/диск и
# сеть от списка нет, scheduler задач нет; масштаб — число записей/запросов.
# Для малого сервера указывать только собственные аккаунты либо оставить
# пусто; зависимость master, неправильный token fail-closed, нужен restart.
AllowedAccounts=

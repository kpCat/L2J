# Отдельная роль настоящих offline Player. Требует Phantom World и OfflineTrade.
# По умолчанию выключена. Все параметры читаются при запуске GameServer.
EnableOfflinePhantomMerchants = True

# Цель, одновременный hard cap и пожизненный лимит новых identities (1..512).
# Старые farmer profiles не превращаются в торговцев. Battle soft/burst cap отдельный.
MerchantTargetStores = 200
MerchantHardCap = 250
MerchantLifetimeIdentityLimit = 300

# Один общий scheduler pulse; 1..10 новых Player за проход, rotation 15..3600 секунд.
# Нет отдельных decision/combat/background jobs на лавку. Native MP regen сохраняется.
MerchantAdmissionBatch = 5
MerchantRotationSeconds = 30
MerchantLinesPerStore = 20

# Ротация ассортимента отдельно от проверки владельца каждые30 секунд.
# 300..86400 секунд;1800 =30 минут. Меняются лишь предложения невидимой
# игрокам лавки без текущей сделки/крафта. Отдельных timers/threads нет.
# Позиции <= native slots и MerchantLinesPerStore;20 не требуется заполнять.
MerchantAssortmentRefreshSeconds = 1800
# 0..50% строк SELL для готового оружия/брони/бижутерии; default20.
# Допустимые grades готовой экипировки. D/C pieces/recipes запрещены независимо.
MerchantGearRotationSharePercent = 20
MerchantMarketGearGrades = NONE,D,C,B,A,S,S80,S84

# Рабочий BUY-капитал отдельно от старых BOOTSTRAP100000. Это авторская
# эмиссия, не заработок: выдаётся при низком wallet, только по durable intent.
# True/False; транш1..1000000000 Adena; cooldown300..86400 секунд.
# По умолчанию50млн за транш, максимум250млн на identity и10млрд суммарно.
# Максимальные bounds: identity10млрд/global1трлн; израсходованное не обнуляется.
# Пример богатого рынка: увеличить транш до100млн и lifetime лимиты, затем
# SaveOwnerConfig.bat. Новая startup policy получает версию; старые receipts
# и все issued counters сохраняются. Изменение требует restart GameServer.
MerchantBuyFundingEnabled = True
MerchantBuyFundingGrantAdena = 50000000
MerchantBuyFundingCooldownSeconds = 1800
MerchantBuyFundingMaxLifetimePerIdentity = 250000000
MerchantBuyFundingGlobalLifetimeCap = 10000000000

# Ограниченный OWNER_PROVISIONED stock. Вначале используются реальные owned
# предметы/покупки; допускается до двух новых типов на identity за1800s epoch.
# Стоимость резервируется ДО native writer по source fair value, для +n —
# через native scroll routes/chances/failures и PhantomEnchantExpectedCost.
# Нет скидки по grade/заточке. Rates drop/spoil учитывает canonical pricing.
# Global1..1трлн Adena source value, identity1..global; default10млрд/500млн.
# Счётчики конечные, включая неизвестные delivery; crash не разрешает replay.
MerchantMarketStockProvisionEnabled = True
MerchantMarketStockGlobalValueCap = 10000000000
MerchantMarketStockPerIdentityValueCap = 500000000
# Пожизненные количества одного template и одного grade:1..1000000.
# Для общих материалов grade NONE; D/C общие материалы разрешены.
MerchantMarketStockPerItemLifetimeCap = 1000
MerchantMarketStockPerGradeLifetimeCap = 50000
# Готовая экипировка1..1000 на grade; stack1..100, gear всегда по1.
MerchantMarketGearPerGradeLifetimeCap = 32
MerchantMarketStockStackCount = 10
# Provision enchant1..25 (default6), дополнительно native legality/route/source.
# Enchanted stock1..32 экземпляров на общий epoch, default4; +0 отдельно.
MerchantMarketStockMaxEnchant = 6
MerchantMarketStockMaxEnchantedPerEpoch = 4
# Конечное число funding+stock intents: identity1..256/global1..32768.
# PREPARED/INCONSISTENT считаются выданной квотой и блокируют торговлю владельца.
MerchantMarketMaxGrantsPerIdentity = 64
MerchantMarketMaxLifetimeGrants = 16384

# Все новые ключи публичные и проходят обычный OwnerConfig Save/Apply/Verify.
# Загрузка один раз; catalog/price universe строится при старте, proposal<=128,
# общий pulse обрабатывает MerchantAdmissionBatch владельцев. Native writers
# и SQL readback только при редком grant/open/transaction, не на каждый tick.

# Явный конечный BOOTSTRAP_CAPITAL/STOCK, не заработок. Квоты фиксируются
# в первом durable server component и НЕ обнуляются сменой конфигов/identity/restart.
# Эти старые квоты не пополняются. S/S80/S84/эпики исключены из birth seed.
# Новые рабочие market grants выше имеют отдельные durable counters/receipts.
MerchantBootstrapCapitalPerIdentity = 100000
MerchantBootstrapGlobalCapital = 30000000
MerchantBootstrapGlobalStockValue = 500000000
MerchantBootstrapPerItemQuota = 10000
MerchantBootstrapStackCount = 100

# BUY и желаемый MANUFACTURE состав; остаток SELL. MANUFACTURE только при реально
# известных рецептах/навыках; без них остаётся SELL, бесплатных craft skills нет.
MerchantBuyPercent = 25
MerchantManufacturePercent = 10

# Native starting classes, проверяются по PlayerTemplateData; новый actor уровня1.
MerchantClassIds = 0,10,53

# До32 явно подготовленных native offline MANUFACTURE character IDs, через запятую.
# Только access0, account заблокирован(-1), нет другого Phantom profile/owner,
# реальные выученные рецепты/skills и непустая лавка, уже восстановленная stock loader.
# Никаких новых денег/stock/уровней/навыков; один durable role и пожизненное место.
# Обычные пользовательские аккаунты и active farmer identities сюда не допускаются.
MerchantPreparedOfflineCharacterIds =


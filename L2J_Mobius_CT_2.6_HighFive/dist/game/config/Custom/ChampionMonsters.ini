# ---------------------------------------------------------------------------
# Champion mobs - Turn random mobs into Champions
# ---------------------------------------------------------------------------

# Enable/Disable Champion Mob System.
ChampionEnable = True

# Force Champion mobs to be passive?
# To leave champion mobs to default/Aggressive, set to False.
# To set all champion mobs to Passive, set True.
ChampionPassive = False

# % chance for a mob to became champion (0 to disable).
ChampionFrequency = 5

# Title of all Champion Mobs.
ChampionTitle = Champion

# Red aura for Champion Mobs.
ChampionAura = True

# Min and max levels allowed for a mob to be a Champion mob.
ChampionMinLevel = 1
ChampionMaxLevel = 100

# Hp multiplier for Champion mobs.
ChampionHp = 50

# Hp Regen Multiplier for Champion mobs.
ChampionHpRegen = 1.1

# Exp/Sp rewards multiplier for Champion mobs.
ChampionRewardsExpSp = 50.0

# Standard rewards chance multiplier for Champion mobs.
ChampionRewardsChance = 50.0

# Standard rewards amount multiplier for Champion mobs.
ChampionRewardsAmount = 50.0

# Adena & Seal Stone rewards chance multiplier for Champion mobs.
ChampionAdenasRewardsChance = 50.0

# Adena & Seal Stone rewards amount multiplier for Champion mobs.
ChampionAdenasRewardsAmount = 50.0

# P. Attack and M. Attack bonus for Champion mobs.
ChampionAtk = 1.1

# Physical/Magical Attack Speed bonus for Champion mobs.
ChampionSpdAtk = 1.1

# Specified id and amount of reward a player will receive if they are awarded the item.
# Separated by ; 
# Example: 6393,1;57,5000
ChampionRewardItems = 6393,1

# % Chance to obtain a specified reward item from a lower level Champion mob.
# Default: 0
ChampionRewardLowerLvlItemChance = 0

# % Chance to obtain a specified reward item from a higher level Champion mob.
# Default: 0
ChampionRewardHigherLvlItemChance = 100

# Do you want to enable the vitality calculation when killing champion mobs?
# Be aware that it can lead to huge unbalance on your server, your rate for that mob would
# then be "mobXP x serverRate x vitalityRate x championXpRate
# Notes:
#	Works only if EnableVitality = True
# Default: False
ChampionEnableVitality = False

# Enable spawning of the champions in instances
# Default = False
ChampionEnableInInstances = True

# Red spoil table multipliers. Stock red did not multiply spoil; 1.0 preserves it.
ChampionSpoilChance = 50.0
ChampionSpoilAmount = 50.0

# ---------------------------------------------------------------------------
# Blue champions. Disabled by default; independent final spawn probability.
# When enabled, ChampionFrequency + BlueChampionFrequency must not exceed 100.
# Invalid blue configuration disables blue champions with a startup warning.
# Eligible monsters use one categorical roll: RED / BLUE / NORMAL.
# Bosses, minions, quest monsters and undying NPCs cannot become champions.
# ---------------------------------------------------------------------------
BlueChampionEnable = True
BlueChampionPassive = False
BlueChampionFrequency = 10
BlueChampionTitle = Blue Champion
BlueChampionAura = True
BlueChampionMinLevel = 1
BlueChampionMaxLevel = 100

# Stock champion HP is effective HP: incoming damage is divided by this value.
# Max HP shown in status/packets remains the native monster Max HP.
BlueChampionHp = 10
BlueChampionHpRegen = 1.1
BlueChampionAtk = 1.1
BlueChampionSpdAtk = 1.1

# Independent reward multipliers; chance and amount are applied only once.
BlueChampionRewardsExpSp = 10.0
BlueChampionRewardsChance = 10.0
BlueChampionRewardsAmount = 10.0
BlueChampionAdenasRewardsChance = 10.0
BlueChampionAdenasRewardsAmount = 10.0
BlueChampionSealStonesRewardsChance = 10.0
BlueChampionSealStonesRewardsAmount = 10.0
BlueChampionSpoilChance = 10.0
BlueChampionSpoilAmount = 10.0

# Same id,count;id,count format as red champions. Empty means no extra item.
BlueChampionRewardItems =
BlueChampionRewardLowerLvlItemChance = 0
BlueChampionRewardHigherLvlItemChance = 0
BlueChampionEnableVitality = False
BlueChampionEnableInInstances = True

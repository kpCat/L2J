# ---------------------------------------------------------------------------
# Личная premium-витрина и каталог нерасходуемых пропусков разницы уровней.
# ---------------------------------------------------------------------------
# Оба shipped default False; путь каталога ниже — shipped default.
# Config и валидированная metadata XML читаются при запуске Game Server.
# После изменения ini или XML нужен перезапуск, одного reload multisell мало.
# Нагрузка ниже описана качественно: отдельного бенчмарка нет.

# True/False, default False: master switch личных premium-QoL функций.
# False отключает дочернюю витрину. Игровой эффект при True зависит от
# EnablePersonalPremiumShop и штатного каталога; пропуски не расходуются.
# CPU низкая на проверку разрешения, RAM низкая для metadata, БД/диск —
# штатные покупки/сохранение inventory, сеть — штатный Alt+B/multisell;
# scheduler/latency новых периодических задач нет. Масштаб — число обращений
# к панели/покупок, не все online игроки. Для малого сервера оставить False
# до осознанного включения и проверки каталога; нужен restart Game Server.
EnablePersonalPremiumQoL=False

# True/False, default False: открывает четыре bounded предложения level-gap
# pass в личной витрине при включённом master switch. Цена принадлежит
# data/multisell/91001.xml, а не этому ключу; stock NPC commerce не меняется.
# CPU низкая на открытие/валидацию покупки, RAM низкая (кэш metadata),
# БД/диск и сеть — только штатная транзакция и показ панели; scheduler/latency
# новых задач нет. Масштаб — частота открытия и покупки. Для малого сервера
# включать только при необходимости, оставляя каталог и цены согласованными;
# зависимость EnablePersonalPremiumQoL=True; нужен restart Game Server.
EnablePersonalPremiumShop=False

# Относительный путь от dist/game, default data/custom/personal-qol/level-gap-items.xml.
# Допустима непустая относительная строка до 160 символов без '..' и
# абсолютного пути. Содержит четыре точных tier item ID/границы, которые
# сверяются с native multisell 91001; несоответствие отключает витрину.
# Игровой эффект — выбор набора пропусков. CPU/БД/сеть/scheduler от самой
# строки нет; RAM низкая и диск: один bounded XML read/validation при старте.
# Масштаб — размер этого bounded каталога, не число игроков. Для малого
# сервера сохранять shipped path; менять только вместе с валидированным XML.
# После изменения ini/XML нужен restart Game Server.
LevelGapItemsFile=data/custom/personal-qol/level-gap-items.xml

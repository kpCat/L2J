# ---------------------------------------------------------------------------
# Личное облегчение прогрессии и отдельное глобальное правило Noblesse.
# ---------------------------------------------------------------------------
# Оба поставляемых значения False. Настройки читаются при старте Game Server;
# после изменения нужен перезапуск. Эти функции независимы друг от друга.
# При ошибке парсинга обе функции отключаются. Проценты нагрузки не измерялись.

# True/False, default False: снимает только ограничение уровня для
# разрешённого реального персонажа при поддерживаемых квестовых проверках.
# Нужен EnablePersonalCharacterQoL и AllowedCharacterIds/AllowedAccounts из
# PersonalCharacterQoL.ini; другим игрокам и Phantom правило не предоставляется.
# Игровой эффект: можно продолжать квест после перерастания его уровня;
# остальные требования и награды остаются штатными. CPU низкая (проверка при
# квестовом действии), RAM нет, БД/диск только штатные операции квеста,
# сеть только штатные сообщения; scheduler/latency новых задач нет.
# Масштаб — число квестовых действий allowlisted игроков. Для малого личного
# сервера включать лишь при необходимости; после изменения перезапустить Game Server.
EnablePersonalQuestOverLevelRelief=False

# True/False, default False: автоматически выдаёт Noblesse по
# подтверждённому условию прогрессии. Правило ГЛОБАЛЬНОЕ: реальные игроки и
# Phantom, без personal allowlist. Игровой эффект — смена статуса, а не обход
# других механик профессии. CPU низкая на проверку перехода, RAM нет,
# БД/диск и сеть — штатная запись/уведомление при фактическом переходе;
# scheduler/latency нового периодического обхода нет. Масштаб — число
# подходящих переходов уровня, не общая численность online. Для малого
# персонального сервера оставить False, если нужен штатный путь Noblesse.
# Не зависит от personal master switch; после изменения нужен restart Game Server.
EnableServerWideAutoNoblesse=False

# ---------------------------------------------------------------------------
# Phantom private market: открытый коридор цен BUY/SELL, High Five.
# ---------------------------------------------------------------------------
# Shipped defaults: скидка BID к проверенной fair value 500 bps (5%),
# надбавка ASK 500 bps (5%). 100 bps = 1%. Это цены объявлений Phantom:
# BUY — фантом платит игроку за вещь; SELL — игрок платит фантому.
# NPC liquidation floor, фактический NPC acquisition ceiling, recipe/enchant
# costs и пригодность источника данных имеют приоритет над процентами ниже.
# Файл читается при старте Game Server. Ошибка или отсутствие любого ключа
# отключает market quotation; изменения требуют перезапуска. Обычные NPC
# магазины, stock Rates.ini и chances data/EnchantItemGroups.xml не меняются.
# Расчёт выполняется при формировании/проверке store plan, не на каждом тике;
# Ниже отдельная политика разрешает bounded автономное создание магазинов.
# постоянного фонового потока, дополнительного scheduler wakeup и сети нет.
# CPU — bounded арифметика/индексированные source queries на quote; RAM —
# небольшой immutable snapshot/cached inputs; БД/диск — штатный durable plan,
# без дополнительных фоновых записей. Масштаб — число quoted store lines,
# а не всё durable population; latency заметнее на частых открытиях магазинов.

# Integer 0..2500 bps, default 500: discount от fair value для BID.
# Например fair 1000, 500 bps дают кандидат 950 Adena. Canonical payout
# Merchant L_npc может поднять BID, а фактический P_npc ограничивает BID
# строго значением < P_npc; если коридор невозможен, BUY исключается.
# Игровой смысл: игроку выгоднее ликвидации у обычного NPC, без цикла
# NPC→Phantom. CPU/RAM/БД-диск/сеть/scheduler сверх общего quote почти нет:
# одна целочисленная операция на line; мало магазинов — default 500;
# 0 сужает spread, 2500 снижает BID, но NPC floor остаётся. Restart.
PhantomMarketBuyDiscountBasisPoints = 500

# Integer 0..2500 bps, default 500: premium над fair value для ASK.
# Например fair 1000, 500 bps дают кандидат 1050 Adena. Итоговый ASK
# дополнительно выше BID/L_npc и не ниже expected recipe/enchant cost.
# Игровой смысл: фантом продаёт дороже своего BUY и не выдаёт дешёвую
# готовую экипировку ниже input floor. CPU/RAM/БД-диск/сеть/scheduler
# сверх quote почти нет; надбавка не изменяет stock NPC shop.
# Малому серверу default 500; 0 оставляет обязательные floors, 2500
# делает объявления дороже. Зависит от legal source-backed valuation;
# изменение вступает в силу после restart Game Server.
PhantomMarketAskPremiumBasisPoints = 500

# Автономный private market работает только при включённом Phantom World.
# True — штатный default: общий scheduler иногда выбирает настоящую
# материальную потребность BUY или безопасный излишек SELL. False — магазины
# не создаются автоматически; ручное quote/open остаётся доступным.
# MANUFACTURE автоматически не публикуется: канонический fee сейчас 0,
# подтверждённой ненулевой платы за услугу в H5 данных нет.
# Проверка производится при старте; изменение требует restart Game Server.
# Дополнительного потока/сетевого запроса нет. Каждый общий pulse проверяет
# открытых owner по памяти и native Player/listing; SQL чтения plan при этом нет.
# Не чаще раза в 15 секунд идут ограниченная попытка, recovery-страница и
# сверка goal/reservation через БД. Транзакция, open/restore/close/shutdown
# используют штатные durable операции отдельно от этого интервала.
# RAM — малая карта открытых owner/cooldown; диск — durable store plan.
EnableAutonomousPhantomMarket = True

# Integer 1..16, default 2: абсолютный максимум одновременно открытых
# Phantom private stores. Дополнительно открыто не более трети ACTIVE
# материализованных Phantom при населении от трёх; при двух — не более
# одного, при единственном Phantom магазинов нет.
# Меньшее значение сохраняет бой/партии/контент и уменьшает CPU проверки
# stock, RAM owner observers, bounded recovery/close БД и сетевые объявления.
# 1 подходит малому серверу, 16 — только после измерения; restart обязателен.
PhantomMarketMaximumOpenStores = 2

# Integer 30..900 секунд, default 120: срок одной видимой native BUY/SELL
# лавки. После срока scheduler закрывает listing и durable plan; stale owner,
# смерть, смена activity/goal или inventory drift закрывают раньше.
# Длинный срок увеличивает время наблюдаемости и одновременно удерживает
# Phantom от боя/движения; короткий повышает CPU quote и БД записей при
# повторном открытии. Сеть получает объявления лишь на open/close. Restart.
PhantomMarketStoreLifetimeSeconds = 120

# Integer 60..3600 секунд, default 600: минимальная пауза после закрытия
# перед новой автономной лавкой того же Phantom. Это предотвращает churn
# native packets, quote CPU, durable БД/диск и голодание обычных занятий.
# 60 ускоряет рынок на маленьком сервере, 3600 оставляет большую паузу;
# зависит от lifetime выше, изменение требует restart Game Server.
PhantomMarketReopenCooldownSeconds = 600

# Память маршрутов обычных соло-фантомов и фоновая GeoData-разведка.
# После изменения файла нужен штатный перезапуск GameServer.
EnableRouteLearning=True
EnableSuperGeoTrainer=False

# Разведка уступает обычным запросам и использует общие потоки PathFinding.
# Физические разведчики используют свободные места сверх обычного online-минимума.
# Сессия начинается при старте сервера и повторяется каждые сутки. Нужен штатный перезапуск.
EnablePhysicalGeoScouts=False
PhysicalGeoScoutCount=4
PhysicalGeoScoutSessionHours=8

GeoTrainerMaxWorkers=1
# Для ночной разведки доступно до 100 принятых проб в минуту.
GeoTrainerMaxProbesPerMinute=20
GeoTrainerSaveIntervalSeconds=120

# Для внешней поставки укажите абсолютный путь к этому каталогу в checkout.
# В Windows используйте прямые слеши, например D:/repo/HighFive/dist/game/data/phantoms/travel/learned.
GeoTrainerDataPath=data/phantoms/travel/learned
